<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa-Ratti</title>
  <!-- Import Federo Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Federo&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #f5f0eb; /* Base beige background */
      --text: #2c2a29;
      --accent: #8c7a6b;
    }
    
    body {
      font-family: 'Federo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 20px 0 20px;
    }

    /* Top bar: White background behind logo sits higher */
    header {
      text-align: center;
      padding: 20px 20px 30px 20px;
      background: linear-gradient(to bottom, #ffffff 70%, var(--bg) 100%);
      margin-left: -20px;
      margin-right: -20px;
      margin-bottom: 30px;
    }

    .logo {
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .back-btn {
      font-family: 'Federo', sans-serif;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 25px;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: #736356;
    }

    /* 3-Column Grid for Home View */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 30px auto; /* 2x gap above border image */
    }

    .card {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      background-color: #e5dfd8;
    }

    .card h3 {
      font-family: 'Federo', sans-serif;
      margin: 15px;
      font-size: 1.05rem;
      font-weight: 400;
      text-align: center;
    }

    /* Item Detail View */
    .detail-view {
      max-width: 1000px;
      margin: 0 auto 30px auto; /* 2x gap above border image */
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e5dfd8;
    }

    /* Footer Styles */
    footer {
      max-width: 1200px;
      margin: 0 auto;
      text-align: left;
      padding: 0 0 50px 0;
    }

    /* 2x gap below border image */
    .border-divider-container {
      text-align: center;
      margin-top: 0;
      margin-bottom: 6px;
    }

    .border-img {
      height: 50px;
      width: auto;
      max-width: 100%;
      display: inline-block;
    }

    footer h2 {
      font-family: 'Federo', sans-serif;
      font-size: 1.6rem;
      font-weight: 400;
      margin: 0 0 12px 0;
      color: #FF0C0C;
    }

    footer p {
      font-family: 'Federo', sans-serif;
      max-width: 700px;
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      color: #44403c;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .border-img { height: 40px; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .border-img { height: 32px; }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Casa-Ratti Logo" class="logo">
  </header>

  <!-- HOME VIEW: 3-Column Grid -->
  <main id="home-view" class="grid"></main>

  <!-- ITEM DETAIL VIEW -->
  <main id="detail-view" class="detail-view" style="display: none;">
    <button class="back-btn" onclick="showHome()">← Back to Casa-Ratti</button>
    <h2 id="item-title"></h2>
    <p id="item-description"></p>
    <div id="item-gallery" class="gallery"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="border-divider-container">
      <img src="border.png" alt="Border motif" class="border-img" onerror="this.style.display='none'">
    </div>
    <h2>Tra noi e il sole</h2>
    <p>My virtual Persol collection, to reconstruct the history of a glorious brand that has been overlooked. Displaying all my pairs, old and new.</p>
  </footer>

  <script>
    // 1. ALL 29 COLLECTION ITEMS CONNECTED TO YOUR IMAGES DIRECTORY
    const glasses = [
      { folder: "Persol Ratti 6201", title: "Persol Ratti 6201" },
      { folder: "Persol Ratti", title: "Persol Ratti" },
      { folder: "Persol Ratti 6622", title: "Persol Ratti 6622" },
      { folder: "Persol Ratti 009", title: "Persol Ratti 009" },
      { folder: "Persol 009", title: "Persol 009" },
      { folder: "Persol Ratti Andrea", title: "Persol Ratti Andrea" },
      { folder: "Persol Ratti 69236", title: "Persol Ratti 69236" },
      { folder: "Persol 130", title: "Persol 130" },
      { folder: "Persol 135", title: "Persol 135" },
      { folder: "Persol Ratti 58230 - Terminator", title: "Persol Ratti 58230 - Terminator" },
      { folder: "Persol Ratti 69229", title: "Persol Ratti 69229" },
      { folder: "Persol Ratti 200 52", title: "Persol Ratti 200 52" },
      { folder: "G.Ratti Dictator aluminium cases", title: "G.Ratti Dictator Aluminium Cases" },
      { folder: "Protector Aluminium Cases", title: "Protector Aluminium Cases" },
      { folder: "Persol Ratti 52-72", title: "Persol Ratti 52/72" },
      { folder: "Persol 9649 24-31", title: "Persol 9649 24/31" },
      { folder: "Persol Trend 47 122", title: "Persol Trend 47 122" },
      { folder: "Persol Steve McQueen - Brown", title: "Persol Steve McQueen - Brown" },
      { folder: "Persol Steve McQueen Black", title: "Persol Steve McQueen Black" },
      { folder: "Persol Ratti 58412", title: "Persol Ratti 58412" },
      { folder: "Persol Ratti 69262", title: "Persol Ratti 69262" },
      { folder: "Persol Brevett", title: "Persol Brevett" },
      { folder: "Persol Ratti 69600-56", title: "Persol Ratti 69600/56" },
      { folder: "Persol Ratti 09141 54-74", title: "Persol Ratti 09141 54-74" },
      { folder: "Persol 810 Pininfarina", title: "Persol 810 Pininfarina" },
      { folder: "Protector Ratti Glasses", title: "Protector Ratti Glasses" },
      { folder: "G.Ratti Protector - Aluminium Case", title: "G.Ratti Protector - Aluminium Case" },
      { folder: "G. Ratti Protector - Aluminium Case", title: "G. Ratti Protector - Aluminium Case" },
      { folder: "G. Ratti Protector - Leather case", title: "G. Ratti Protector - Leather Case" }
    ];

    // 2. AUTOMATICALLY GENERATE COLLECTION DATA WITH ENCODED PATHS
    const collectionData = glasses.map(item => {
      const folderPath = `images/${encodeURIComponent(item.folder)}`;
      return {
        id: item.folder,
        title: item.title,
        description: item.description || `Collection piece from Casa-Ratti: ${item.title}.`,
        coverImage: `${folderPath}/cover.jpg`,
        images: [
          `${folderPath}/cover.jpg`,
          `${folderPath}/photo-1.jpg`,
          `${folderPath}/photo-2.jpg`
        ]
      };
    });

    const homeView = document.getElementById('home-view');
    const detailView = document.getElementById('detail-view');

    // Render 3-column home grid
    function renderHome() {
      homeView.innerHTML = '';
      collectionData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => showDetail(item.id);
        card.innerHTML = `
          <img src="${item.coverImage}" alt="${item.title}" onerror="this.style.opacity='0.3'">
          <h3>${item.title}</h3>
        `;
        homeView.appendChild(card);
      });
    }

    // Render detail view with multiple photos
    function showDetail(itemId) {
      const item = collectionData.find(i => i.id === itemId);
      if (!item) return;

      document.getElementById('item-title').textContent = item.title;
      document.getElementById('item-description').textContent = item.description;
      
      const gallery = document.getElementById('item-gallery');
      gallery.innerHTML = item.images.map(src => 
        `<img src="${src}" alt="${item.title}" onerror="this.style.display='none'">`
      ).join('');

      homeView.style.display = 'none';
      detailView.style.display = 'block';
      window.scrollTo(0, 0);
    }

    function showHome() {
      detailView.style.display = 'none';
      homeView.style.display = 'grid';
    }

    // Initial render
    renderHome();
  </script>
</body>
</html>
